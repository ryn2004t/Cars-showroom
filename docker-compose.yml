version: "3.9"
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: service_provider
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - db
  backend:
    build: ./backend
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: service_provider
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: please-change-me
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    depends_on:
      - db
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: /api
      VITE_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
volumes:
  db_data:
